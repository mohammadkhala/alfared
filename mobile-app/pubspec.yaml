name: alfared_app
description: "تطبيق أبناء الفريد للتسوّق الإلكتروني"
publish_to: 'none'
version: 1.1.4+15

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # HTTP + State
  dio: ^5.7.0
  provider: ^6.1.2

  # Persistence
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # UI
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10
  carousel_slider: ^5.0.0
  shimmer: ^3.0.0
  intl: ^0.20.2

  # Forms / Fields
  fluttertoast: ^8.2.8

  # Push Notifications + Auth
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_auth: ^5.3.1
  flutter_local_notifications: ^17.2.3

  # Misc
  url_launcher: ^6.3.1
  package_info_plus: ^8.0.2

  # Payment WebView
  webview_flutter: ^4.10.0
  flutter_html: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.png"
  min_sdk_android: 23
  # Logo is blue/orange on white, so the adaptive background is white too —
  # the foreground is keyed transparent and blends into it cleanly.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/logo_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900
